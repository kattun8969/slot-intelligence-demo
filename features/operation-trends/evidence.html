<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>設定投入傾向｜証拠分析</title><style>body{margin:0;background:#f1f5f9;color:#183247;font:15px/1.7 system-ui,sans-serif}header{background:#16334e;color:#fff;padding:24px}main{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce4eb;border-radius:12px;padding:18px;margin:14px 0}input,select,button{font:inherit;padding:9px;margin:5px;border-radius:7px;border:1px solid #b4c5d2}button{background:#16558a;color:#fff;cursor:pointer}label{display:inline-block;margin:6px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}a{color:#16558a}.muted{color:#556e7c}.notice{background:#fff4da;padding:12px}</style></head><body><header><h1>設定投入傾向｜根拠の比較</h1><p>店舗・機種ごとのSNS／取材結果を時系列で比較する試作版</p></header><main><p><a href="../../index.html">トップページ</a> / <a href="./index.html">稼働貢献・公開実測データ</a></p><section class="card"><h2>根拠データを読み込む</h2><p class="notice">権利確認済みのJSONファイルを端末内で集計します。自動収集や設定投入確率の予測は行いません。実在する店舗のデータは初期登録されていません。</p><label>JSONファイル <input id="file" type="file" accept=".json,application/json"></label><p id="status" role="status"></p><label>店舗ID <select id="store"><option value="">すべて</option></select></label><label>機種ID <select id="machine"><option value="">すべて</option></select></label><label>比較基準日 <input id="asOf" type="date"></label><button id="run" type="button">比較する</button><button id="export" type="button">結果をJSON保存</button></section><section class="card"><h2>比較結果</h2><div id="result" aria-live="polite">JSONを読み込むと集計できます。</div></section><section class="card"><h2>根拠の扱い</h2><p>過去90日と直近28日は重複しない期間です。取材の対象台公開は設定確定と扱わず、後日公開された情報を過去の予測に混入させません。報告の増減は設定投入率そのものではありません。</p></section></main><script src="./evidence-engine.js"></script><script src="./evidence-import.js"></script><script src="./temporal-trends.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let records=[],last=null;const today=new Date().toISOString().slice(0,10);$('asOf').value=today;
function options(id,values){const el=$(id);el.replaceChildren(new Option('すべて',''));for(const v of [...new Set(values)].sort())el.add(new Option(v,v));}
$('file').onchange=async()=>{try{const file=$('file').files[0];if(!file)return;const data=JSON.parse(await file.text());const result=SlotEvidenceImport.importRecords(data);records=result.accepted.filter(r=>{try{return SlotEvidence.validate(r);}catch{return false;}});$('status').textContent='取込 '+records.length+'件／入力拒否 '+result.rejected_count+'件／追加検証除外 '+(result.accepted_count-records.length)+'件';options('store',records.map(r=>r.store_id));options('machine',records.map(r=>r.machine_id));$('run').click();}catch(e){$('status').textContent='読込失敗: '+e.message;}};
const cell=(tr,v)=>{const td=document.createElement('td');td.textContent=String(v);tr.append(td);};
$('run').onclick=()=>{try{last=SlotTrend.summarize(records,{asOf:$('asOf').value,store_id:$('store').value||undefined,machine_id:$('machine').value||undefined});const el=$('result');el.replaceChildren();const p=document.createElement('p');p.textContent='報告傾向: '+last.reported_evidence_direction+'（高設定投入確率の予測ではありません）';el.append(p);const table=document.createElement('table');const head=document.createElement('tr');['期間','対象日数','報告数','独立情報源','確定報告','取材結果','SNS','反証'].forEach(v=>{const th=document.createElement('th');th.textContent=v;head.append(th);});table.append(head);for(const [name,v] of [['直近28日',last.recent],['それ以前90日',last.baseline]]){const tr=document.createElement('tr');[name,v.days,v.records,v.independent_sources,v.confirmed_reports,v.event_targets,v.social_reports,v.contradictions].forEach(x=>cell(tr,x));table.append(tr);}el.append(table);const foot=document.createElement('p');foot.className='muted';foot.textContent=last.disclaimer;el.append(foot);}catch(e){$('result').textContent='集計できません: '+e.message;}};
$('export').onclick=()=>{if(!last){$('status').textContent='先に比較してください';return;}const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='evidence-trend.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
