name: Cache approved machine images on the public site
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-public-images.yml
      - docs/machine-image-sources.json
      - scripts/cache_machine_images.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion dependency
        run: python -m pip install pillow==11.3.0
      - name: Cache source-attributed image files
        run: python scripts/cache_machine_images.py
      - name: Commit local photos for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/
          if ! git diff --cached --quiet; then
            git commit -m "Publish cached machine and hint photos"
            git push origin HEAD:main
          fi
