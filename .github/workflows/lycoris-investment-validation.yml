name: Lycoris investment add-on offline validation
on:
  pull_request:
    paths:
      - 'wordpress-assets/lycoris-investment.js'
      - 'scripts/test_lycoris_investment.cjs'
      - '.github/workflows/lycoris-investment-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check wordpress-assets/lycoris-investment.js
      - run: node scripts/test_lycoris_investment.cjs
