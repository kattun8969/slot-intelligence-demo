name: WordPress news pipeline offline validation

on:
  pull_request:
    paths:
      - 'scripts/wp_news_sync.py'
      - 'scripts/test_wp_news_sync.py'
      - 'wordpress-queue/news/**'
      - '.github/workflows/wp-news-*.yml'

permissions:
  contents: read

jobs:
  validate-news-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/wp_news_sync.py scripts/test_wp_news_sync.py
      - name: Run offline unit tests (no WordPress secrets or network)
        run: python3 -m unittest discover -s scripts -p 'test_wp_news_sync.py' -v
      - name: Validate news candidate JSON syntax (without editor approval)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('wordpress-queue/news').glob('*.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or not payload.get('title') or not payload.get('slug'):
                  raise ValueError('Invalid news candidate: ' + str(path))
              print('Candidate syntax OK:', path)
          PY
