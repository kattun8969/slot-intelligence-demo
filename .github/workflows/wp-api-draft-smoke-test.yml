name: WordPress API draft-only smoke test

on:
  workflow_dispatch:
  push:
    branches: [editor/wp-news-262]
    paths: ['.github/workflows/wp-api-draft-smoke-test.yml']

permissions:
  contents: read

concurrency:
  group: kajiplus-wordpress-news-draft
  cancel-in-progress: false

jobs:
  draft-only:
    if: github.ref == 'refs/heads/editor/wp-news-262'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Check WordPress permissions, deduplicate, and verify draft for issue 262
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from html.parser import HTMLParser
          import json
          import os
          import re
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://kajiplus.info"
          API = "/wp-json/wp/v2"
          NEWS = f"{API}/minna_news_edit"
          MACHINES = f"{API}/minna_machine"
          KEYWORD = "ゼーガペイン"
          SOURCE = "xp5id8Tdfas"
          CAPABILITIES = ("create_posts", "edit_posts", "edit_others_posts", "edit_published_posts", "publish_posts")
          PAYLOAD = {"title":"スマスロゼーガペインETRの製品PV公開、12月7日導入予定","slug":"zegapain-etr-pv-20261120","status":"draft","content":"<!-- wp:paragraph -->\n<p>山佐PR情報局は11月20日、山佐ネクストの新台「スマスロゼーガペインETR」の製品PVを公開しました。ホール導入は12月7日予定です。</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>PVでは、ボーナスにつながる「ゼーガシステム」や、7揃いでATゲーム数を上乗せする「セブンインパクト」などが紹介されています。</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><a href=\"https://www.youtube.com/watch?v=xp5id8Tdfas\" target=\"_blank\" rel=\"noopener noreferrer\">山佐PR情報局の製品PV</a> ／ <a href=\"https://yamasa-next.co.jp/slot/zgmhm3/\" target=\"_blank\" rel=\"noopener noreferrer\">メーカーの機種ページ</a></p>\n<!-- /wp:paragraph -->"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, new_url):
                  return None

          class Article(HTMLParser):
              def __init__(self, value):
                  super().__init__()
                  self.text = []
                  self.links = []
                  self.feed(value)

              def handle_data(self, value):
                  self.text.append(value)

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.links.append(dict(attrs).get("href"))

              def signature(self):
                  return (" ".join(" ".join(self.text).split()), self.links)

          def normalize(value):
              return re.sub(r"\s+", "", unicodedata.normalize("NFKC", value)).casefold()

          def endpoint(path, **params):
              return path + "?" + urllib.parse.urlencode(params)

          def request(path, method="GET", payload=None, public=False, allowed=()):
              headers = {"Accept": "text/html" if public else "application/json"}
              if not public:
                  headers["Authorization"] = authorization
              body = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(payload).encode()
              try:
                  req = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
                  with opener.open(req, timeout=25) as response:
                      data = response.read()
                      if public:
                          return response.status, data.decode("utf-8")
                      return response.status, json.loads(data)
              except urllib.error.HTTPError as exc:
                  print(f"{method} {path.split('?')[0]}: HTTP {exc.code}")
                  if exc.code in allowed:
                      return exc.code, None
                  raise SystemExit("WordPress request halted") from None
              except (OSError, ValueError):
                  raise SystemExit("WordPress response could not be verified") from None

          def candidates():
              matches = {}
              for query in ({"slug": PAYLOAD["slug"]}, {"search": KEYWORD}, {"search": SOURCE}):
                  _, posts = request(endpoint(NEWS, context="edit", status="any", per_page=100, **query))
                  if not isinstance(posts, list) or len(posts) >= 100:
                      raise SystemExit("WordPress duplicate search did not return a bounded result")
                  matches.update({post["id"]: post for post in posts})
              return list(matches.values())

          def verify(post):
              if (
                  post["status"] != "draft"
                  or post["slug"] != PAYLOAD["slug"]
                  or post["title"]["raw"] != PAYLOAD["title"]
                  or Article(post["content"]["raw"]).signature() != Article(PAYLOAD["content"]).signature()
              ):
                  raise SystemExit("Saved draft differs from issue 262 or has been edited manually")

          def main():
              _, me = request(endpoint(API + "/users/me", context="edit", _fields="id,capabilities"))
              if not me.get("id"):
                  raise SystemExit("WordPress identity could not be verified")
              effective = me.get("capabilities") or {}
              print("GitHub Secrets authentication: OK")
              rules = {}
              for route, name in ((NEWS, "minna_news_edit"), (MACHINES, "minna_machine")):
                  _, options = request(route, "OPTIONS")
                  if not {"GET", "POST"}.issubset(options.get("methods", [])):
                      raise SystemExit("Expected WordPress route methods were not found")
                  code, schema = request(endpoint(API + "/types/" + name, context="edit"), allowed=(401, 403))
                  if code == 200 and schema.get("capabilities"):
                      rules[name] = schema["capabilities"]
                      detail = ", ".join(f"{key}={bool(effective.get(rules[name].get(key)))}" for key in CAPABILITIES)
                      print(f"{name}: GET/POST registered; publicly viewable={schema.get('viewable')}; {detail}")
                  else:
                      print(f"{name}: GET/POST registered; capability mapping unavailable")
                  code, _ = request(endpoint(route, context="edit", per_page=1, _fields="id"), allowed=(401, 403))
                  print(f"{name} edit-context collection: HTTP {code}")

              code, _ = request(endpoint(MACHINES + "/16", context="edit", _fields="id"), allowed=(401, 403, 404))
              print(f"Existing reference machine edit-context read: HTTP {code}")
              _, home = request("/", public=True)
              top = normalize(" ".join(Article(home).text))
              if KEYWORD in top or SOURCE.casefold() in home.casefold():
                  raise SystemExit("Possible existing coverage on the public homepage; review before writing")

              existing = candidates()
              if len(existing) > 1:
                  raise SystemExit("Multiple matching news records; review before writing")
              if existing:
                  verify(existing[0])
                  post_id = existing[0]["id"]
                  print(f"Matching draft reused; ID: {post_id}")
              else:
                  status, created = request(NEWS, "POST", PAYLOAD)
                  if status != 201 or created.get("status") != "draft" or not created.get("id"):
                      raise SystemExit("Draft creation response was unexpected; check WordPress before retrying")
                  post_id = created["id"]
                  print(f"News draft saved; ID: {post_id}")

              _, reread = request(endpoint(NEWS + f"/{post_id}", context="edit"))
              verify(reread)
              if [post["id"] for post in candidates()] != [post_id]:
                  raise SystemExit("Duplicate verification changed after the draft was saved")
              print(f"Draft re-fetch and duplicate check: OK; status: draft; ID: {post_id}")
              print("Preview and any publication require editor review in WordPress.")

          base = os.environ.get("WP_BASE_URL", "").rstrip("/")
          username = os.environ.get("WP_USERNAME", "")
          password = os.environ.get("WP_APP_PASSWORD", "")
          if base != BASE or not username or not password:
              raise SystemExit("WordPress Secrets are missing or the destination does not match")
          authorization = "Basic " + base64.b64encode(f"{username}:{password}".encode()).decode()
          opener = urllib.request.build_opener(NoRedirect())
          try:
              main()
          except (KeyError, TypeError, AttributeError):
              raise SystemExit("WordPress response schema was unexpected; check the draft before retrying") from None
          PY
