name: Operation trends evidence tests
on:
  push:
    branches:
      - feat/operation-news-setting-trends-mvp
    paths:
      - 'features/operation-trends/**'
      - 'index.html'
      - '.github/workflows/operation-trends-tests.yml'
  pull_request:
    paths:
      - 'features/operation-trends/**'
      - 'index.html'
      - '.github/workflows/operation-trends-tests.yml'
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test features/operation-trends/*.test.cjs
      - run: for file in features/operation-trends/*.js; do node --check "$file" || exit 1; done
