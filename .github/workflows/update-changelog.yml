name: Sync TOP content after updates
on:
  push:
    branches: [main]
    paths:
      - 'docs/machines/**'
      - 'docs/changelog.js'
      - 'docs/industry-news.json'
      - 'scripts/update_changelog.py'
      - 'scripts/sync_top_content.py'
  pull_request:
    paths:
      - 'scripts/sync_top_content.py'
      - 'scripts/update_changelog.py'
      - '.github/workflows/update-changelog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-top:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update machine changelog from merged commits
        run: python scripts/update_changelog.py
      - name: Generate static TOP and archive
        run: python scripts/sync_top_content.py
      - name: Validate static output
        run: |
          python - <<'PY'
          from pathlib import Path
          top=Path("docs/index.html").read_text()
          archive=Path("docs/updates.html").read_text()
          assert '<div class="site-changelog-scroll" id="site-changelog-items"' in top
          assert '<div class="industry-news-list"' in top
          assert '<a class="changelog-entry"' in archive
          print("Static TOP and archive validated")
          PY
      - name: Commit and push generated HTML and changelog
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.js docs/index.html docs/updates.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "docs: auto-sync TOP news and machine history"
            git push origin HEAD:main
          fi
